<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#ec4899;#3b82f6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#3b82f6;#8b5cf6;#ec4899" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="240" rx="16" fill="#0d1117"/>
  <circle cx="450" cy="120" r="220" fill="url(#glow)">
    <animate attributeName="r" values="200;240;200" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles -->
  <circle cx="120" cy="60" r="2" fill="#60a5fa">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="180" r="2" fill="#a78bfa">
    <animate attributeName="cy" values="180;160;180" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="50" r="1.5" fill="#f472b6">
    <animate attributeName="cy" values="50;70;50" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Name -->
  <text x="450" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="700" fill="#ffffff">
    Irsyad Zainul Abidin
    <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Role -->
  <text x="450" y="148" text-anchor="middle" font-family="Fira Code, Consolas, monospace"
        font-size="16" fill="#8b949e">
    Full-Stack Developer · IoT Tinkerer · Container Architect
    <animate attributeName="opacity" values="0;1" begin="0.6s" dur="1.2s" fill="freeze"/>
  </text>

  <!-- Animated underline -->
  <rect x="350" y="170" width="200" height="3" rx="1.5" fill="url(#line)">
    <animate attributeName="width" values="0;200" dur="1s" begin="1s" fill="freeze"/>
    <animate attributeName="x" values="450;350" dur="1s" begin="1s" fill="freeze"/>
  </rect>
</svg>